# Expectation for empty-witness.yaml
#
# Data, not code. The harness reads this file; it does not carry these values.
# A red fixture MUST fail at this path with this keyword. Failing merely somewhere is
# how a parse error impersonates a caught defect, so any other failure fails the run.

fixture: empty-witness
finding: RF-13
expect:
  instancePath: "/invariants/INV-01/witness"
  keyword: minItems
why: >-
  A declaration with an empty witness list. Asserting conformance while pointing nowhere is the exact defect the witness rule exists to catch.
