# E-I.2 — Judge Not
#
# Schema: services/gnomon-lint/jurisdiction.schema.json (v1.0, G0 draft)
# Serves as the normative witness for that schema (SCHEMA.md §Worked example). Per FS method
# P5, rule and witness MUST agree — if this file and the schema disagree, work halts until the
# conflict is recorded.
#
# PROVENANCE. The `decides` and `does_not_decide` questions are the declaration published in
# README.md, restructured. Fields marked [NEW] did not exist in the v0 shape and are PROPOSED
# from a reading of ESSAY.md v1.0 — they carry no conferral and need review before this panel
# is treated as ratified alongside the essay. Open item: O-JUR-J01.

id: E-I.2
title: "Judge Not: Discernment, Responsibility, and the Judgment of the Self"
version: "1.0"
movement: I
gate: G3

# CHARTER.md §4.5. Corpus prose never self-ratifies. v1.0 was promoted at G3 before the charter
# existed and no conferral record is on file, so the *ratified* predicate is suspended — what is
# pending is conferral, not identity. The version and the content anchor remain facts.
ratification:
  status: pending-conferral

# [NEW] Spine location. Grounds SPINE.md's stage->essay mapping (O-SPN-01) and makes the
# spine self-coverage check (O-SPN-03) mechanical.
spine:
  stages: [see, judge]
  scales: [self, dyad, body]      # §12 self; §7-9 circles; §11 institution

decides:
  - license conditions for prudential judgment of conduct
  - verdict/precaution register separation (two thresholds)
  - "delegated corporate judgment: duties to accuser, accused, institution"
  - "reflexive limit: examination without self-sentence"

# MUST be non-empty. The claim of jurisdiction is inseparable from the disclaimer of it.
does_not_decide:
  - question: post-wrong first-person repair
    disposition: handoff
    to: E-III.1

  - question: release of the offender
    disposition: handoff
    to: E-III.2

  - question: binding force of one's own conscience
    disposition: handoff
    to: E-I.3

  - question: legitimacy and limits of authority
    disposition: handoff
    to: E-VI.1

  # [NEW] The essay's two reservations, declared at §3.6 and enacted at §15. Absent from the
  # v0 panel because the v0 shape had no way to express a decline that hands off to nothing.
  # Their absence made the panel silent about the essay's most important refusal.
  - question: >-
      character as God sees it — the whole person weighed with every mitigating history,
      every wound, every grace received and every grace refused
    disposition: reserved
    stratum: character

  - question: the final standing of any person before God
    disposition: reserved
    stratum: destiny

# INV-01. Presence is mechanical; correctness is adjudicated at G1.
axes:
  responsibility: "rises stranger -> household; peaks at guardianship"
  humility: "rises toward the interior; absolute at strata 4-5"

# INV-02.
registers: [verdict, precaution]

# [NEW] INV-03, graded. Replaces v0's `reserved_strata_touched`, which could not distinguish
# addressing a stratum from licensing assertions at it — see SCHEMA.md D-4. This essay
# addresses all five (§3.6 defines the map) and licenses at three.
strata:
  acts: licensed                        # §3.6 "public... the proper object of human judgment"
  patterns: licensed                    # §3.6 "inferable with care... legitimate objects"
  intention_culpability: defeasible     # §3.6 "revisable estimates, never settled knowledge"
  character: reserved                   # §3.6 "inaccessible"
  destiny: reserved                     # §3.6 "absolutely reserved"

# [NEW] Witnessed declarations. Replaces v0's five bare `declared` values — see SCHEMA.md D-5
# and INVARIANTS.md §Declaration.
invariants:
  INV-01:
    status: honored
    witness: ["§1.3", "§9.1", "§12.1"]      # two axes; care raises responsibility; reversal at the self

  INV-02:
    status: honored
    witness: ["§3.5", "§9.2"]               # the two-register principle; precaution without verdict

  INV-03:
    status: honored
    witness: ["§3.6", "§15"]                # the five strata; the verdict reserved even at the self

  INV-04:
    status: honored
    witness: ["§5.1", "§2.4"]               # fruit is not an isolated act; by their fruits

  INV-05:
    status: honored
    witness: ["§3.5", "§9.2", "§16"]        # provisional, proportionate, revisable; conversion left open

grounds: [ARCHON, CTS, ARIADNE, WillObservatory]   # resolution deferred pending F-03

carrier:
  title: "The Gavel and the Watch"
  version: "1.0"
